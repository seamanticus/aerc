version = "2"

[run]
# don't lint tests
tests = false

# gofumpt is a stricter superset of gofmt; golangci-lint v2.15.0 bundles
# gofumpt v0.12.0. `make fmt` runs `golangci-lint fmt` with this config.
[formatters]
enable = [
	"gofumpt",
]

# enable additional linters, on top of the v2 "standard" set (errcheck,
# govet, ineffassign, staticcheck, unused)
[linters]
disable = [
	"staticcheck",
]
enable = [
	"nolintlint", # nolint comments require justification
	"errorlint", # check to ensure no problems with wrapped errors
	"gocritic", # check for bugs, performance, and style issues
]

[linters.settings.nolintlint]
allow-unused = false # don't allow nolint if not required
require-explanation = true # require an explanation when disabling a linter
require-specific = true # linter exceptions must specify the linter
