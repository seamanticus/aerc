name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  fedora:
    name: Fedora ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    env:
      DESTDIR: ./out
    steps:
      # git is needed by actions/checkout to fetch a repository instead of
      # a tarball, tar by actions/setup-go, diffutils and gawk by
      # filters/test.sh
      - run: dnf install -y --setopt=install_weak_deps=False
          diffutils gawk gcc git gnupg2 make scdoc tar
      - uses: actions/checkout@v4
      # The workspace is owned by the runner user, not the container's root:
      # git refuses it as dubious ownership and go build fails to stamp VCS
      # info (exit status 128)
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Fedora's golang package sets GOTOOLCHAIN=local and may lag behind
      # the go.mod requirement
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: make
      - run: make tests
      - run: make install checkinstall
      - if: matrix.arch == 'x86_64'
        run: make lint
